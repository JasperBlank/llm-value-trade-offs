# Predictions in machine-readable form, so 07_compare_predictions.py can score them.
# Human-readable originals: JASPER_PREDICTIONS.md and CLAUDE_PREDICTIONS.md.
#
# Effects are RELATIVE: percentage change of the care rate compared with the reference
# condition (-30 means a care rate of 60% becomes 42%). Ranges are 80% intervals.
# Probabilities are between 0 and 1.

jasper:
  goal:                {best: -30, low: -70, high: -7}
  unmonitored:         {best: -50, low: -80, high: -20}
  away:                {best: -10, low: -50, high: 10}
  random:              {best: -10, low: -50, high: 10}
  individual_vs_group: {best: 0, low: -40, high: 40}
  largest_effect:      {unmonitored: 0.5, goal: 0.3, away: 0.2}
  manipulation_works:  0.7
  stuck_versions:      {best: 3, low: 0, high: 10}
  same_type_more_alike: 0.7
  one_shared_signal:   0.5
  # Added 2026-10-29 (07:11 and 07:15 Europe/Amsterdam), before step 3 was run.
  rising_ladders:      {best: 2, low: 0, high: 10}
  mean_rise_pp:        {best: 10, low: 0, high: 30}   # 10b, in points
  persona_profile_by_harm_type: 0.4   # Jasper's own uncertainty about this probability: 10% to 70%

