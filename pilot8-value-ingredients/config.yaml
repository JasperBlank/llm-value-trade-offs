# Pilot 8 settings. Everything under `prereg` is PRE-REGISTERED (DESIGN.md, section 4).
models:
  qwen: {path: Qwen/Qwen3-14B, map_layers: [4, 8, 12, 16, 20, 24, 28, 32, 36, 40]}
dtype: bfloat16
batch_size: 16
results_dir: results/real

fit: {bootstrap: 200, seed: 8}

map:
  n_pairs: 84                    # all minimal pairs (size steps 84; domain contrasts 32 each)
  sites: [A_end, A_nl, B_nl, after_B, last]
  a_sites: [A_end, A_nl]
  seed: 8

das:
  k: 1
  epochs: 2
  batch_size: 32
  lr: 0.002
  seed: 8
  a_layer_max: 24                # the rule searches layers up to here
  sweep_pairs: 96                # training pairs used by the rule's sweep

prereg:
  w1_full: 0.8                   # W1: worth = domain + slope_domain x log(amount), held-out R² >= 0.8 ...
  w1_partial: 0.5                # ... 0.5-0.8: partly; below 0.5: not explained this way
  w3_slope_factor: 1.5           # W3: one sensitivity to size: all slopes positive, largest / smallest <= 1.5
  w2_corr: 0.7                   # W2: held-out outcomes' positions correlate >= 0.7 with their worth, and the
                                 #     position grows with log(amount) in every domain

quick:
  models:
    qwen: {path: Qwen/Qwen3-0.6B, map_layers: [4, 8, 12, 16, 20, 24, 28]}
  results_dir: results/quick
  batch_size: 8
  fit: {bootstrap: 10}
  map: {n_pairs: 16}
  das: {epochs: 1, batch_size: 16, sweep_pairs: 16}
  limit: {behaviour: 800, das_train: 96, das_test: 48, pairs: 32}
