# Pilot 8 settings. Everything under `prereg` is PRE-REGISTERED (DESIGN.md, section 4).
models:
  qwen: {path: Qwen/Qwen3-14B, map_layers: [4, 8, 12, 16, 20, 24, 28, 32, 36, 40]}
dtype: bfloat16
batch_size: 16
results_dir: results/real

fit: {bootstrap: 200, seed: 8}

map:
  n_pairs: 96                    # all minimal pairs per ingredient (96; the domain contrasts have 64)
  sites: [A_end, A_nl, B_nl, after_B, last]
  a_sites: [A_end, A_nl]
  seed: 8

das:
  k: 1
  epochs: 2
  batch_size: 32
  lr: 0.002
  seed: 8
  a_layer_max: 24                # the rule searches layers up to here
  sweep_pairs: 96                # training pairs used by the rule's sweep

prereg:
  w1_full: 0.7                   # W1: held-out R² of the main-effects model >= 0.7: a sum of ingredients ...
  w1_partial: 0.4                # ... 0.4-0.7: partly; below 0.4: not explained by these ingredients
  w2_corr: 0.7                   # W2: held-out outcomes' positions correlate >= 0.7 with their worth ...
  w2_weights: 0.7                # ... and the ingredients' effects on position correlate >= 0.7 with their effects on worth

quick:
  models:
    qwen: {path: Qwen/Qwen3-0.6B, map_layers: [4, 8, 12, 16, 20, 24, 28]}
  results_dir: results/quick
  batch_size: 8
  fit: {bootstrap: 10}
  map: {n_pairs: 16}
  das: {epochs: 1, batch_size: 16, sweep_pairs: 16}
  limit: {behaviour: 800, das_train: 96, das_test: 48, pairs: 32}
