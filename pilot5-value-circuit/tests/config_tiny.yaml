# Test configuration: a tiny random Qwen3 (10 blocks, 4 heads) built by tests/make_tiny.py.
model: TINY
dtype: float32
batch_size: 8
acts_dir: ACTS
pilot4_acts: /nonexistent
results_dir: RES
layers: [4, 5, 6, 8]
primary_layer: 5
penalty:
  v_a: {4: 1.0, 5: 1.0, 6: 1.0, 8: 1.0}
  v_b: {4: 1.0, 5: 1.0, 6: 1.0, 8: 1.0}
limit: {test: 300, goal: 20, fresh: 120}
steering:
  strengths: [-2, -1, 0, 1, 2]
  control_strengths: [-2, 2]
  window: [0.2, 0.8]
  max_prompts: 80
  min_prompts: 40
  seed: 20261102
  shuffles: 2
  shuffle_max_abs_corr: 0.1
  bootstrap: 200
  criteria: {min_slope: 0.5, max_slope: 2.0, control_max_ratio: 0.3, currency_ratio: 1.5}
circuit:
  source_directions: [v_a, v_b]
  patch_layers: [2, 4, 6, 8, 10]
  topk: [3, 6]
  n_pairs: 40
  pair_max_abs_logodds: 4.0
  n_readers: 4
  reader_steer_prompts: 16
  letter_head_corr: 0.5
  seed: 5
