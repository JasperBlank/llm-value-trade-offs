# Both prediction sets in one place, for score_predictions.py. Probabilities 0-1; ranges are
# 80% intervals [low, high]. Unless a key says otherwise: Qwen3-14B, strangers.
# Claude's numbers are copied from claude_predictions.yaml (sealed before Jasper's).

gate_passes:
  14b: {claude: 0.40, jasper: 0.40}
  32b: {claude: 0.50, jasper: 0.60}
  8b: {claude: 0.10, jasper: 0.10}
first_criterion_to_break:      # most failures over 14B, 32B, 8B x both groups
  claude: "2"
  jasper: "3"                  # runner-up 2
median_rate_miss:              # criterion 2
  claude: {best: 1.35, range: [1.10, 2.20]}
  jasper: {best: 1.5, range: [1.3, 1.8]}      # first given as 1.64
pairs_within_x2:               # criterion 2, of 15
  claude: {best: 11, range: [7, 15]}
  jasper: {best: 10, range: [7, 13]}
transitivity_worse:            # criterion 3, worse triplet
  claude: {best: 1.35, range: [1.10, 2.50]}
  jasper: {best: 1.4, range: [1.2, 1.6]}
menu_invariance_passes:
  claude: 0.30
  jasper: 0.50
description_invariance_passes:
  claude: 0.55
  jasper: 0.60
loss_aversion:
  claude: {best: 1.5, range: [0.8, 3.0]}
  jasper: {best: 1.58, range: [1.18, 1.98]}
loss_aversion_family:          # Jasper only
  jasper: {best: 2.45, range: [2.05, 2.85]}
closeness_multiplier:
  claude: {best: 2.0, range: [1.2, 4.0]}
  jasper: {best: 2.08, range: [1.68, 2.48]}
closeness_uniform:
  claude: 0.35
  jasper: 0.10
goal_v1_rule_like:             # at 1 against 8
  claude: 0.85
  jasper: 0.95                 # first given as 80%
goal_v1_holds_at_1_vs_32:
  claude: 0.65
  jasper: 0.80
goal_v1_holds_at_1_vs_128:     # Jasper only (128 was added after Claude's predictions were sealed)
  jasper: 0.50
goal_v2_rule_like:
  claude: 0.15
  jasper: 0.15
goal_v2_welfare_price:         # people per file; "above 32" = one file beats 32 people
  claude: {best: 3, range: [0.7, "above 32"]}
  jasper: {best: 4.4, range: [2, 10]}
